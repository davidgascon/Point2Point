<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Checkout"/>
<meta name="theme-color" content="#0E1419"/>
<title>Field Checkout</title>
<link rel="manifest" href="/manifest.webmanifest"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="/vendor/pocketbase.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1419;--panel:#18212A;--panel2:#213039;--edge:#2E3E4A;
  --text:#EAF1F5;--dim:#8AA0AD;--faint:#546874;
  --pass:#3DD68C;--fail:#F4524D;--issue:#F5A524;--wired:#6BA4E8;--inst:#A88BE0;
  --accent:#FF8A3D;--shadow:rgba(0,0,0,.45);
  /* Raised when the app is embedded (a preview frame has its own floating
     header). Zero on a real install, where the app owns the screen. */
  --topgap:0px;
  --safetop:env(safe-area-inset-top, 0px);
}
:root[data-theme="day"]{
  --ink:#E9EEF1;--panel:#FFFFFF;--panel2:#F1F5F7;--edge:#BFCDD6;
  --text:#0C1318;--dim:#4E626E;--faint:#7B8D98;
  --pass:#0E8F55;--fail:#C42B26;--issue:#9A5E00;--wired:#1E5FA8;--inst:#6B3FAF;
  --accent:#B4501A;--shadow:rgba(20,40,55,.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--ink);color:var(--text);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;
  -webkit-text-size-adjust:100%}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-feature-settings:"zero" 1}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
input,textarea{background:var(--ink);border:1px solid var(--edge);border-radius:10px;padding:12px 13px;width:100%}
:root[data-theme="day"] input,:root[data-theme="day"] textarea{background:#fff}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
::-webkit-scrollbar{width:0;height:0}

#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--ink)}
.bar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--edge);
  padding:calc(10px + var(--topgap) + var(--safetop)) 10px 10px;display:flex;align-items:center;gap:4px;min-height:56px}
.bar h1{font-size:16px;font-weight:600;letter-spacing:-.01em;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.bar .sub{display:block;font-size:11.5px;color:var(--dim);font-weight:400;letter-spacing:0}
.iconbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;
  color:var(--dim);font-size:17px;flex:none}
.iconbtn:active{background:var(--panel2)}
.iconbtn.armed{color:var(--issue);background:rgba(245,165,36,.14)}
.body{flex:1;padding:14px;padding-bottom:26px}

.strip{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:9px 14px;
  background:var(--panel2);border-bottom:1px solid var(--edge);color:var(--dim)}
.led{width:8px;height:8px;border-radius:50%;flex:none}
.strip .grow{flex:1;min-width:0}
.strip button{font-size:12.5px;font-weight:600;color:var(--accent);padding:6px 9px;
  border:1px solid var(--edge);border-radius:8px;min-height:34px}

.signin{flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:calc(28px + var(--topgap)) 22px 28px;gap:18px}
.mark{display:flex;align-items:center;gap:9px}
.mark .glyph{width:34px;height:34px;border-radius:9px;background:var(--accent);
  display:grid;place-items:center;color:#14100C;font-weight:700;font-size:17px;flex:none}
.mark h2{font-size:23px;font-weight:600;letter-spacing:-.02em}
.signin p{color:var(--dim);font-size:14px;max-width:36ch}
.who-pick{display:flex;gap:8px}
.who-pick button{flex:1;min-height:50px;border-radius:10px;border:1px solid var(--edge);
  font-size:14px;font-weight:500;color:var(--dim)}
.who-pick button[aria-pressed="true"]{background:var(--text);color:var(--ink);border-color:var(--text)}

.big{width:100%;min-height:54px;border-radius:12px;font-weight:600;font-size:16px;
  display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#14100C}
.big:active{transform:translateY(1px)}
.big[disabled]{opacity:.4}
.ghost{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--edge);
  color:var(--text);font-weight:500;font-size:15px;margin-top:9px}
.danger{color:var(--fail);border-color:var(--fail)}

.tip{margin:0 0 4px;border-radius:11px;padding:12px 14px;font-size:13px;
  background:rgba(107,164,232,.12);border:1px solid var(--wired);color:var(--text)}
.tip b{display:block;margin-bottom:4px;font-size:13.5px}
.tip ol{margin:7px 0 0 17px;color:var(--dim);font-size:12.5px;line-height:1.65}

.proj{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--edge);
  border-left:4px solid var(--accent);border-radius:12px;padding:14px;margin-bottom:11px}
.proj:active{background:var(--panel2)}
.proj .job{font-size:12px;color:var(--dim)}
.proj .nm{font-size:17px;font-weight:600;margin:1px 0 3px;letter-spacing:-.01em}
.proj .loc{font-size:13px;color:var(--dim)}
.rail{height:6px;border-radius:3px;background:var(--edge);margin-top:11px;overflow:hidden;display:flex}
.rail i{display:block;height:100%}
.railtxt{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:6px}

.finder{padding:12px 14px;background:var(--ink);border-bottom:1px solid var(--edge)}
.finder input{padding:13px 14px;font-size:16px}
.grouphd{padding:12px 14px 6px;font-size:12px;font-weight:600;color:var(--faint);
  letter-spacing:.04em;background:var(--ink)}
.unit{display:flex;align-items:stretch;gap:0;width:100%;text-align:left;
  border-bottom:1px solid var(--edge);min-height:78px}
.unitmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:14px;text-align:left}
.unitmain:active{background:var(--panel)}
.unit .grow{flex:1;min-width:0}
.unitpct{flex:none;width:86px;border-left:1px solid var(--edge);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0 6px}
.unitpct:active{background:var(--panel)}
.unitpct b{font-size:20px;font-weight:600;line-height:1.05}
.unitpct span{font-size:10.5px;color:var(--dim);letter-spacing:.02em}
.unitpct .chev{font-size:13px;color:var(--faint);transition:transform .15s}
.unitpct[aria-expanded="true"] .chev{transform:rotate(90deg)}
.bkdn{background:var(--panel);border-bottom:1px solid var(--edge);padding:13px 14px 15px}
.brow{display:grid;grid-template-columns:70px 1fr 74px;align-items:center;gap:10px;margin-bottom:9px}
.brow:last-child{margin-bottom:0}
.brow .bl{font-size:12.5px;color:var(--dim)}
.brow .bb{height:7px;border-radius:4px;background:var(--edge);overflow:hidden;display:flex}
.brow .bb i{display:block;height:100%}
.brow .bn{font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.bnote{font-size:11.5px;color:var(--faint);margin-top:11px}
.projpct{display:flex;align-items:baseline;gap:7px;margin-top:9px}
.projpct b{font-size:22px;font-weight:600;letter-spacing:-.02em}
.projpct span{font-size:12.5px;color:var(--dim)}
.unit .nm{font-size:17px;font-weight:600;letter-spacing:-.01em}
.unit .sys{font-size:12.5px;color:var(--dim);margin-top:1px}
.unit .rail{margin-top:9px;height:5px}
.count{flex:none;text-align:right;min-width:60px}
.count b{display:block;font-size:19px;font-weight:600;line-height:1.1}
.count span{font-size:11px;color:var(--dim)}
.flagdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--fail);
  vertical-align:middle;margin-left:5px}
.here{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--wired);
  font-weight:600;margin-top:4px}
.here i{width:6px;height:6px;border-radius:50%;background:var(--wired);display:block}
.allrow{margin:12px 14px;border:1px dashed var(--edge);border-radius:11px;padding:13px;
  width:calc(100% - 28px);text-align:left;font-size:14px;color:var(--dim)}

.chips{display:flex;gap:7px;overflow-x:auto;padding:11px 14px;
  background:var(--ink);border-bottom:1px solid var(--edge);scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--edge);
  font-size:13.5px;font-weight:500;color:var(--dim);white-space:nowrap;min-height:40px}
.chip[aria-pressed="true"]{background:var(--text);color:var(--ink);border-color:var(--text)}
.chip b{font-weight:600}
.unitbar{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--panel2);
  border-bottom:1px solid var(--edge)}
.unitbar .nm{font-size:15px;font-weight:600;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unitbar button{font-size:13px;color:var(--accent);font-weight:600;padding:8px 10px;
  border-radius:9px;min-height:38px;border:1px solid var(--edge)}
.subhd{padding:10px 14px 5px;font-size:11.5px;font-weight:600;color:var(--faint);
  letter-spacing:.05em;background:var(--ink);border-bottom:1px solid var(--edge)}

.pt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 14px;border-bottom:1px solid var(--edge);min-height:66px}
.pt:active{background:var(--panel)}
.pt .tag{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.pt .desc{font-size:12.5px;color:var(--dim);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt .grow{flex:1;min-width:0}
.stat{width:11px;height:11px;border-radius:50%;flex:none;background:var(--edge)}
.who{font-size:11px;color:var(--faint);margin-top:2px}
.qbadge{font-size:10px;font-weight:700;color:var(--issue);border:1px solid var(--issue);
  border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.fresh{animation:flash 1.8s ease-out}
@keyframes flash{0%{background:rgba(107,164,232,.3)}100%{background:transparent}}
.pill{font-size:12px;padding:4px 9px;border-radius:7px;background:var(--panel2);
  color:var(--dim);border:1px solid var(--edge)}
.pill.type{color:#14100C;font-weight:600;border:none}
.emptyish{padding:44px 20px;text-align:center;color:var(--dim);font-size:14px}
.emptyish b{display:block;color:var(--text);font-size:16px;font-weight:600;margin-bottom:5px}
.more{width:100%;padding:15px;font-size:13.5px;color:var(--accent);font-weight:600;
  border-top:1px solid var(--edge)}

.vhead{padding:16px 16px 14px;border-bottom:1px solid var(--edge)}
.vtag{font-size:24px;font-weight:600;letter-spacing:-.02em;word-break:break-all;line-height:1.15}
.vdesc{font-size:15px;margin-top:5px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.addrow{display:flex;align-items:center;gap:10px;margin-top:12px;
  border:1px solid var(--edge);border-radius:11px;padding:9px 11px;background:var(--panel)}
.addrow .al{font-size:11px;color:var(--dim);font-weight:600;letter-spacing:.04em;flex:none}
.addrow input{border:none;background:none;padding:4px 0;font-family:"IBM Plex Mono",monospace;
  font-size:17px;font-weight:600;flex:1;min-width:0}
.addrow input:focus{outline:none}
.addrow .ed{font-size:11px;color:var(--faint);flex:none}
.sortchip{flex:none;padding:8px 14px;border-radius:999px;border:1px dashed var(--edge);
  font-size:13.5px;font-weight:500;color:var(--accent);white-space:nowrap;min-height:40px}
.sortrow{width:100%;text-align:left;padding:15px 16px;border-bottom:1px solid var(--edge);
  font-size:15px;display:flex;align-items:center;gap:10px}
.sortrow:active{background:var(--panel2)}
.sortrow .tick{margin-left:auto;color:var(--accent);font-weight:700}
.pt .adr{font-family:"IBM Plex Mono",monospace;color:var(--faint)}
.pkg{display:block;width:100%;text-align:left;padding:14px;border-bottom:1px solid var(--edge)}
.pkg:active{background:var(--panel)}
.pkg .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.pkg .nm{font-size:16px;font-weight:600;letter-spacing:-.01em}
.pkg .mt{font-size:12.5px;color:var(--dim);margin-top:2px}
.pkg .bar2{height:7px;border-radius:4px;background:var(--edge);margin-top:10px;overflow:hidden}
.pkg .bar2 i{display:block;height:100%;background:var(--pass)}
.who2{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;
  background:var(--wired);color:#0B1013;letter-spacing:.03em}
.pkgbar{display:flex;align-items:center;gap:10px;padding:11px 14px;
  background:rgba(107,164,232,.12);border-bottom:1px solid var(--wired);font-size:13.5px}
.pkgbar b{font-weight:600}
.newbadge{font-size:10px;font-weight:700;color:var(--wired);border:1px solid var(--wired);
  border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:middle;letter-spacing:.03em}
.pkgbar button{margin-left:auto;font-size:12.5px;color:var(--accent);font-weight:600;
  padding:7px 10px;border-radius:9px;border:1px solid var(--edge);min-height:36px}
section.blk{padding:16px;border-bottom:1px solid var(--edge)}
.blk h3{font-size:13px;font-weight:600;color:var(--dim);margin-bottom:11px}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:48px;border-radius:10px;border:1px solid var(--edge);
  font-size:13.5px;font-weight:500;color:var(--dim)}
.seg button[aria-pressed="true"]{color:#14100C;font-weight:600;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.num{text-align:center;font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600;padding:13px 6px}
.dev{margin-top:11px;border-radius:10px;padding:11px 13px;font-size:14px;font-weight:600;
  border:1px solid var(--edge);color:var(--dim);display:flex;justify-content:space-between;align-items:center;gap:10px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ck{min-height:52px;border-radius:10px;border:1px solid var(--edge);display:flex;
  align-items:center;gap:9px;padding:0 13px;font-size:14px;font-weight:500;color:var(--dim)}
.ck .box{width:21px;height:21px;border-radius:6px;border:2px solid var(--faint);flex:none;
  display:grid;place-items:center;font-size:13px;color:var(--ink)}
.ck[aria-pressed="true"]{color:var(--text)}
.takeover{margin:0 16px 16px;border-radius:11px;padding:12px 13px;font-size:13.5px;
  background:rgba(107,164,232,.14);border:1px solid var(--wired)}

.disc{width:100%;display:flex;align-items:center;gap:10px;padding:15px 16px;text-align:left;
  border-bottom:1px solid var(--edge)}
.disc:active{background:var(--panel)}
.disc .grow{flex:1;min-width:0}
.disc .t{font-size:13px;font-weight:600;color:var(--dim)}
.disc .s{font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disc .chev{color:var(--faint);font-size:15px;flex:none;transition:transform .15s}
.disc[aria-expanded="true"] .chev{transform:rotate(90deg)}
.discbody{border-bottom:1px solid var(--edge);padding:0 16px 16px}

.selbox{width:23px;height:23px;border-radius:6px;border:2px solid var(--faint);flex:none;
  display:grid;place-items:center;font-size:14px;color:var(--ink);font-weight:700}
.selbox.on{background:var(--accent);border-color:var(--accent)}
.selall{width:100%;padding:13px 14px;font-size:13.5px;font-weight:600;color:var(--accent);
  border-bottom:1px solid var(--edge);text-align:left}
.massdock{position:sticky;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--edge);
  padding:12px 14px calc(12px + env(safe-area-inset-bottom, 0px));box-shadow:0 -8px 24px var(--shadow)}
.massdock .hd{font-size:12.5px;color:var(--dim);margin-bottom:9px}
.mchips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.mchip{min-height:46px;border-radius:10px;border:1px solid var(--edge);display:flex;
  align-items:center;gap:8px;padding:0 12px;font-size:14px;font-weight:500;color:var(--dim)}
.mchip .box{width:19px;height:19px;border-radius:5px;border:2px solid var(--faint);flex:none;
  display:grid;place-items:center;font-size:12px;color:var(--ink)}
.mchip[aria-pressed="true"]{color:var(--text)}
.mmode{display:flex;gap:6px;margin-bottom:10px}
.mmode button{flex:1;min-height:42px;border-radius:9px;border:1px solid var(--edge);
  font-size:13.5px;font-weight:500;color:var(--dim)}
.mmode button[aria-pressed="true"]{background:var(--text);color:var(--ink);border-color:var(--text)}

.ovl{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:80;display:flex;
  align-items:flex-end;justify-content:center}
:root[data-theme="day"] .ovl{background:rgba(12,19,24,.42)}
.sheet{background:var(--panel);width:100%;max-width:520px;border-radius:18px 18px 0 0;
  border-top:1px solid var(--edge);max-height:92%;overflow-y:auto;padding:18px 16px 20px}
.sheet h2{font-size:18px;font-weight:600;letter-spacing:-.01em}
.sheet .sh{font-size:13px;color:var(--dim);margin-top:3px;margin-bottom:15px}
.sheet .lb{font-size:12.5px;color:var(--dim);font-weight:500;margin:14px 0 7px}
.sheet .row{display:flex;gap:8px;margin-top:16px}
.sheet .row button{flex:1;min-height:52px;border-radius:12px;font-weight:600;font-size:15px}
.segwrap{display:flex;gap:6px;flex-wrap:wrap}
.segwrap button{flex:1 1 auto;min-width:72px;min-height:44px;border-radius:9px;
  border:1px solid var(--edge);font-size:13.5px;font-weight:500;color:var(--dim);padding:0 8px}
.segwrap button[aria-pressed="true"]{color:#14100C;font-weight:600;border-color:transparent}

.def{display:block;width:100%;text-align:left;padding:14px;border-bottom:1px solid var(--edge)}
.def:active{background:var(--panel)}
.defhd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.defno{font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--dim)}
.prio{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.03em}
.def .tg{font-size:15px;font-weight:600;letter-spacing:-.01em}
.def .un{font-size:12.5px;color:var(--dim);margin-top:1px}
.def .ds{font-size:13.5px;margin-top:7px}
.def .ft{font-size:11.5px;color:var(--faint);margin-top:7px}
.banner{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:13px 14px;background:rgba(244,82,77,.11);border-bottom:1px solid var(--fail);
  font-size:13.5px;font-weight:600;color:var(--text)}
.banner:active{background:rgba(244,82,77,.2)}
.banner .arw{margin-left:auto;color:var(--fail)}
.kind{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;
  letter-spacing:.03em;color:#0B1013}
.scope{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;
  letter-spacing:.03em;border:1px solid var(--edge);color:var(--dim)}
.blocks{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;
  letter-spacing:.03em;background:var(--fail);color:#0B1013}
.thumbs{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.thumbs img{width:60px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--edge)}
.phgrid{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.phgrid .ph{position:relative}
.phgrid img{width:74px;height:74px;object-fit:cover;border-radius:9px;border:1px solid var(--edge)}
.phgrid .rm{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;
  background:var(--fail);color:#0B1013;font-weight:700;font-size:14px;display:grid;place-items:center}
.addph{width:74px;height:74px;border-radius:9px;border:1px dashed var(--edge);
  display:grid;place-items:center;color:var(--dim);font-size:22px;cursor:pointer}
.uissue{display:flex;align-items:flex-start;gap:9px;padding:12px 14px;
  border-bottom:1px solid var(--edge);background:rgba(245,165,36,.09);font-size:13px}
.uissue b{display:block;font-size:13.5px;margin-bottom:2px}
.fab{position:sticky;bottom:0;z-index:20;background:var(--panel);
  border-top:1px solid var(--edge);padding:11px 14px}
.hoursbox{display:flex;align-items:center;gap:10px;margin-top:8px}
.hoursbox input{width:96px;text-align:center;font-family:"IBM Plex Mono",monospace;
  font-size:18px;font-weight:600;padding:11px 6px}
.hoursbox span{font-size:12.5px;color:var(--dim)}

.dock{position:sticky;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--edge);
  padding:11px 14px calc(11px + env(safe-area-inset-bottom, 0px));box-shadow:0 -8px 24px var(--shadow)}
.verdicts{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.vb{min-height:60px;border-radius:13px;font-weight:700;font-size:16px;color:#0B1013;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.vb small{font-size:10.5px;font-weight:600;opacity:.62;letter-spacing:.03em}
.vb:active{transform:translateY(1px)}
.docknav{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;
  font-size:12.5px;color:var(--dim);gap:8px}
.docknav button{padding:7px 11px;border-radius:9px;border:1px solid var(--edge);font-size:13px;min-height:38px}
.docknav button:disabled{opacity:.35}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;
  background:var(--text);color:var(--ink);padding:11px 17px;border-radius:11px;font-size:14px;
  font-weight:600;z-index:60;box-shadow:0 6px 20px var(--shadow);max-width:88%;text-align:center}

.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;
  border-bottom:1px solid var(--edge);font-size:13.5px}
.kv span:first-child{color:var(--dim)}
.kv span:last-child{font-weight:600;text-align:right}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{font-size:13px;color:var(--dim);font-weight:600;margin-bottom:4px}
.qrow{font-size:12px;color:var(--dim);padding:7px 0;border-bottom:1px solid var(--edge);
  display:flex;justify-content:space-between;gap:10px}
.note{font-size:12.5px;color:var(--faint);padding:16px 14px;text-align:center}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.switch .lab{font-size:14px;font-weight:500}
.switch .hint{font-size:12px;color:var(--dim);margin-top:2px}
.tgl{width:54px;height:32px;border-radius:16px;background:var(--edge);flex:none;position:relative;transition:background .15s}
.tgl i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;
  background:var(--text);transition:transform .15s}
.tgl[aria-pressed="true"]{background:var(--issue)}
.tgl[aria-pressed="true"] i{transform:translateX(22px);background:#14100C}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

var DB=null, MEM={kv:{},queue:{}}, USE_MEM=false;
function idb(){
  if(USE_MEM)return Promise.reject();
  if(DB)return Promise.resolve(DB);
  return new Promise(function(res,rej){
    try{
      var r=indexedDB.open("fieldcheckout_demo",1);
      r.onupgradeneeded=function(){
        var d=r.result;
        if(!d.objectStoreNames.contains("kv"))d.createObjectStore("kv");
        if(!d.objectStoreNames.contains("queue"))d.createObjectStore("queue",{keyPath:"id"});
      };
      r.onsuccess=function(){DB=r.result;res(DB)};
      r.onerror=function(){USE_MEM=true;rej()};
    }catch(e){USE_MEM=true;rej()}
  });
}
function kvGet(k){return idb().then(function(d){
  return new Promise(function(res){
    var q=d.transaction("kv","readonly").objectStore("kv").get(k);
    q.onsuccess=function(){res(q.result)};q.onerror=function(){res(undefined)};
  });
}).catch(function(){return MEM.kv[k]})}
function kvSet(k,v){MEM.kv[k]=v;return idb().then(function(d){
  d.transaction("kv","readwrite").objectStore("kv").put(v,k);
}).catch(function(){})}
function qAll(){return idb().then(function(d){
  return new Promise(function(res){
    var q=d.transaction("queue","readonly").objectStore("queue").getAll();
    q.onsuccess=function(){res(q.result||[])};q.onerror=function(){res([])};
  });
}).catch(function(){return Object.keys(MEM.queue).map(function(k){return MEM.queue[k]})})}
function qAdd(e){MEM.queue[e.id]=e;return idb().then(function(d){
  d.transaction("queue","readwrite").objectStore("queue").put(e)}).catch(function(){})}
function qDel(id){delete MEM.queue[id];return idb().then(function(d){
  d.transaction("queue","readwrite").objectStore("queue").delete(id)}).catch(function(){})}
function wipe(){MEM={kv:{},queue:{}};return idb().then(function(d){
  var t=d.transaction(["kv","queue"],"readwrite");
  t.objectStore("kv").clear();t.objectStore("queue").clear();
}).catch(function(){})}

    var img=new Image();
    img.onload=function(){
      var max=1200,w=img.width,hh=img.height;
      if(w>max||hh>max){var s=max/Math.max(w,hh);w=Math.round(w*s);hh=Math.round(hh*s)}
      var cv=document.createElement("canvas");cv.width=w;cv.height=hh;
      cv.getContext("2d").drawImage(img,0,0,w,hh);
      try{cb(cv.toDataURL("image/jpeg",0.62))}catch(e){cb(null)}
    };
    img.onerror=function(){cb(null)};
    img.src=fr.result;
  };
  fr.onerror=function(){cb(null)};
  fr.readAsDataURL(file);
}

function applyEvent(ev,projects){
  var p=(projects||S.projects).filter(function(x){return x.id===ev.projectId})[0];
  if(!p)return null;
  if(ev.kind==="addpoint"){
    if(!p.points.some(function(x){return x.id===ev.point.id}))
      p.points.push(JSON.parse(JSON.stringify(ev.point)));
    return null;
  }
  if(ev.kind==="package"){
    p.packages=p.packages||[];
    var pi=-1;p.packages.forEach(function(q,i){if(q.id===ev.pkg.id)pi=i});
    if(pi>=0)p.packages[pi]=ev.pkg;else p.packages.push(ev.pkg);
    return null;
  }
  if(ev.kind==="issue"){
    p.issues=p.issues||[];
    var ix=-1;p.issues.forEach(function(q,i){if(q.id===ev.issue.id)ix=i});
    if(ix>=0)p.issues[ix]=ev.issue;else p.issues.push(ev.issue);
    return null;
  }
  if(ev.kind==="resolve"){
    p.issues=p.issues||[];
    p.issues.forEach(function(q){
      if(q.id===ev.issueId){q.resolved=!!ev.resolved;
        q.resolvedBy=ev.resolved?ev.by:null;q.resolvedAt=ev.resolved?ev.at:null}
    });
    return null;
  }
  var pt=p.points.filter(function(x){return x.id===ev.pointId})[0];
  if(!pt)return null;
  if(ev.kind==="edit"){pt[ev.field]=ev.value;return pt}
  if(ev.kind==="life"){
    if(["Pass","Fail","Issue"].indexOf(pt.status)>=0)return pt;   // never downgrade
    pt.status=ev.status;pt.by=ev.status?ev.by:null;pt.at=ev.status?ev.at:null;
    return pt;
  }
  if(ev.kind==="checks"){
    var c=Object.assign({},pt.checks);
    Object.keys(ev.checks).forEach(function(k){
      if(ev.mode==="clear")delete c[k];
      else if(ev.mode==="na")c[k]="na";
      else c[k]="done";
    });
    pt.checks=c;pt.checksBy=ev.by;pt.checksAt=ev.at;
    return pt;
  }
  if(pt.at&&pt.at>ev.at)return pt;
  pt.status=ev.status;pt.by=ev.by;pt.at=ev.at;
  if(ev.reading)pt.reading=ev.reading;
  if(ev.checks)pt.checks=ev.checks;
  if(ev.notes!==undefined)pt.notes=ev.notes;
  if(ev.issue)pt.issue=Object.assign({},ev.issue,{at:ev.at,by:ev.by,resolved:false});
  else if(ev.status==="Pass"&&pt.issue&&!pt.issue.resolved)
    pt.issue=Object.assign({},pt.issue,{resolved:true,resolvedBy:ev.by,resolvedAt:ev.at});
  return pt;
}
var SIM={events:[],claims:{}};
function pushEvents(evs){
  if(LIVE){
    // Sequential on purpose: order matters for the audit trail, and a phone
    // coming back from a dead zone should not open 40 sockets at once.
    return evs.reduce(function(chain,ev){
      return chain.then(function(){return pbSendEvent(ev)});
    },Promise.resolve());
  }
  return new Promise(function(res,rej){
    setTimeout(function(){
      if(!online())return rej();
      evs.forEach(function(e){if(!SIM.events.some(function(x){return x.id===e.id}))SIM.events.push(e)});
      res();
    },650);
  });
}
function flush(){
  if(S.syncing||!S.queue.length||!online())return Promise.resolve();
  S.syncing=true;render();
  var batch=S.queue.slice();
  return pushEvents(batch).then(function(){
    return Promise.all(batch.map(function(e){return qDel(e.id)}));
  }).then(function(){
    S.queue=S.queue.filter(function(e){return!batch.some(function(b){return b.id===e.id})});
    S.lastSync=Date.now();S.syncing=false;render();
  }).catch(function(){S.syncing=false;render()});
}
var LIVE_SEEN=0;
function liveTick(){
  if(LIVE)return;                       // handled by the realtime subscription
  if(!online()||!S.projects.length||!S.user)return;
  var inc=SIM.events.filter(function(e){return e.at>LIVE_SEEN&&e.by!==S.user.id});
  if(!inc.length)return;
  LIVE_SEEN=Math.max.apply(null,inc.map(function(e){return e.at}));
  var msg=null;
  inc.forEach(function(ev){
    var pt=applyEvent(ev);
    if(!pt)return;

/* ───────── derived ───────── */
function stats(list){
  var z={total:list.length,Pass:0,Fail:0,Issue:0,Wired:0,Installed:0,NA:0};
  list.forEach(function(x){
    if(x.p2pNA&&["Pass","Fail","Issue"].indexOf(x.status)<0){z.NA++;return}
    if(x.status&&z[x.status]!==undefined)z[x.status]++;
  });
  z.done=z.Pass+z.Fail+z.Issue+z.NA;z.flag=z.Fail+z.Issue;z.left=z.total-z.done;
  return z;
}
function units(){
  var m={},order=[];
  proj().points.forEach(function(x){
    if(!m[x.unit]){m[x.unit]={name:x.unit,sys:x.sys,pts:[]};order.push(x.unit)}
    m[x.unit].pts.push(x);
  });
  return order.map(function(k){return m[k]});
}
function unitPts(){
  var p=proj();if(!p)return[];
  if(S.pkg){
    var pk=packages(p).filter(function(k){return k.id===S.pkg})[0];
    if(pk)return pkgPoints(p,pk);
  }
  return S.unit?p.points.filter(function(x){return x.unit===S.unit}):p.points.slice();
}
var SORTS=[["sheet","Sheet order"],["name","Point name"],["addr","I/O address"],["type","Data type"]];
var TORD={AI:0,AO:1,DI:2,DO:3};
function natCmp(a,b){
  var ta=String(a||"").match(/(\d+|\D+)/g)||[],tb=String(b||"").match(/(\d+|\D+)/g)||[];
  for(var i=0;i<Math.max(ta.length,tb.length);i++){
    var x=ta[i],y=tb[i];
    if(x===undefined)return -1; if(y===undefined)return 1;
    var nx=/^\d/.test(x),ny=/^\d/.test(y);
    if(nx&&ny){var d=parseInt(x,10)-parseInt(y,10);if(d)return d}
    else{var c=x.localeCompare(y);if(c)return c}
  }
  return 0;
}
function sortPts(list){
  if(S.sort==="sheet")return list;
  var c=list.slice();
  if(S.sort==="name")c.sort(function(a,b){return natCmp(a.tag,b.tag)});
  else if(S.sort==="addr")c.sort(function(a,b){
    var e1=!a.addr,e2=!b.addr;
    if(e1!==e2)return e1?1:-1;
    return natCmp(a.addr,b.addr)||natCmp(a.tag,b.tag)});
  else if(S.sort==="type")c.sort(function(a,b){
    var d=(TORD[a.type]===undefined?9:TORD[a.type])-(TORD[b.type]===undefined?9:TORD[b.type]);
    return d||natCmp(a.tag,b.tag)});
  return c;
}
function queue(){
  var l=unitPts();
  if(S.filter==="open")l=l.filter(function(x){return["Pass","Fail","Issue"].indexOf(x.status)<0});
  else if(S.filter==="flag")l=l.filter(function(x){return x.status==="Fail"||x.status==="Issue"});
  else if(S.filter==="pass")l=l.filter(function(x){return x.status==="Pass"});
  return sortPts(l);
}
function railOf(list){
  var z=stats(list);
  return'<div class="rail">'+[["Pass",z.Pass],["Fail",z.Fail],["Issue",z.Issue],["Wired",z.Wired],["Installed",z.Installed]]
    .map(function(s){var w=z.total?s[1]/z.total*100:0;
      return w?'<i style="width:'+w+'%;background:'+col(s[0])+'"></i>':""}).join("")+'</div>';
}
function qHas(id){return S.queue.some(function(e){return e.pointId===id})}
function packages(p){return (p||proj()) ? ((p||proj()).packages||[]) : []}
function pkgPoints(p,pk){
  var set={};(pk.pointIds||[]).forEach(function(i){set[i]=1});
  return p.points.filter(function(x){return set[x.id]});
}
function pkgStats(p,pk){
  var pts=pkgPoints(p,pk),done=pts.filter(function(x){
    return["Pass","Fail","Issue"].indexOf(x.status)>=0||x.p2pNA}).length;
  return{total:pts.length,done:done,left:pts.length-done,
    pct:pts.length?Math.round(done/pts.length*100):0};
}
function myPackages(p){
  return packages(p).filter(function(k){return k.assignee===S.user.id});
}
function openPkgCount(){
  var n=0;
  S.projects.forEach(function(p){
    myPackages(p).forEach(function(k){if(pkgStats(p,k).left>0)n++});
  });
  return n;
}
function dueLabel(d){
  if(!d)return "";
  var days=Math.round((d-Date.now())/86400000);
  if(days<0)return "overdue";
  if(days===0)return "due today";
  if(days===1)return "due tomorrow";
  return "due in "+days+" days";
}
function hasVerdict(pt){return["Pass","Fail","Issue"].indexOf(pt.status)>=0}
/* Once a point has been checked out, it was necessarily wired to get there. */
function lifeState(pt){
  if(hasVerdict(pt))return{value:"Wired",implied:true};
  if(LIFE.indexOf(pt.status)>=0)return{value:pt.status,implied:false};
  return{value:null,implied:false};
}
function whoName(pt){
  if(pt.by&&TECHS[pt.by])return TECHS[pt.by].n;
  if(pt.importedBy)return pt.importedBy+" (from sheet)";
  return "";
}
function whoInit(pt){
  if(pt.by&&TECHS[pt.by])return TECHS[pt.by].i;
  return pt.importedBy||"";
}

/* checks are tri-state: unset, "done", or "na" (legacy true reads as done) */
function ckState(checks,c){
  var v=checks&&checks[c];
  if(v===true||v==="done")return "done";
  if(v==="na")return "na";
  return null;
}
function ckNext(v){return v==="done"?"na":(v==="na"?null:"done")}
function ckLabel(v){return v==="done"?"✓":(v==="na"?"—":"")}
function ckColor(v){return v==="done"?"var(--pass)":(v==="na"?"var(--faint)":null)}
/* a check is settled when it is done OR marked not applicable */
function ckStats(pts,c){
  var done=0,na=0;
  pts.forEach(function(p){var v=ckState(p.checks,c);if(v==="done")done++;else if(v==="na")na++});
  return{done:done,na:na,total:pts.length,settled:done+na,
    pct:pts.length?Math.round((done+na)/pts.length*100):0};
}
function instStats(pts){
  var n=0,na=0;
  pts.forEach(function(p){
    if(p.p2pNA&&!p.installedBy){na++;return}
    if(p.installedBy||["Installed","Wired","Pass","Fail","Issue"].indexOf(p.status)>=0)n++;
  });
  return{done:n,na:na,total:pts.length,settled:n+na,
    pct:pts.length?Math.round((n+na)/pts.length*100):0};
}
function pctDone(pts){var z=stats(pts);return z.total?Math.round(z.done/z.total*100):0}
function breakdown(pts){
  var z=stats(pts);
  return[
    ["Verified",{done:z.done,na:0,total:z.total,settled:z.done,
      pct:z.total?Math.round(z.done/z.total*100):0},"var(--pass)"],
    ["Installed",instStats(pts),"var(--wired)"],
    ["Trend/hist",ckStats(pts,"Trends"),"var(--accent)"],
    ["Alarm",ckStats(pts,"Alarm"),"var(--issue)"],
    ["Graphic",ckStats(pts,"Graphic"),"var(--inst)"],
    ["Startup",ckStats(pts,"Startup"),"var(--dim)"]
  ];
}

function readingSummary(pt,d){
  if(isAnalog(pt.type)){
    var f=parseFloat(d.found),b=parseFloat(d.bas),t=parseFloat(d.tol);
    if(isNaN(f)||isNaN(b))return'<span style="color:var(--faint)">Not recorded</span>';
    var dev=Math.round((b-f)*100)/100;
    if(isNaN(t))return'<span class="mono">'+d.found+' → '+d.bas+'</span>';
    var ok=Math.abs(dev)<=Math.abs(t);
    return'<span class="mono">'+d.found+' → '+d.bas+'</span> '+
      '<span style="color:'+(ok?"var(--pass)":"var(--fail)")+'">'+(ok?"in tolerance":"out of tolerance")+'</span>';
  }
  if(!d.cmd||!d.obs)return'<span style="color:var(--faint)">Not recorded</span>';
  return'<span class="mono">'+d.cmd+' → '+d.obs+'</span> '+
    '<span style="color:'+(d.cmd===d.obs?"var(--pass)":"var(--fail)")+'">'+
    (d.cmd===d.obs?"matches":"does not match")+'</span>';
}
function vVerify(){
  var list=queue(),pt=list[S.idx],d=S.draft;

      }).join("")+'</div>'+
      '<div style="font-size:12px;color:var(--faint);margin-top:9px">'+
      'Passing the point marks it wired automatically — only set this if you are stopping short of checkout.</div>');

  var rInner = ana
    ? '<div class="three">'+fld("rF","At the device",d.found)+fld("rB","On the BAS",d.bas)+
      fld("rT","Tolerance ±",d.tol)+'</div><div class="dev" id="dev"></div>'

        (v?"color:var(--text)":"")+'"><span class="box" style="'+
        (cc?"background:"+cc+";border-color:"+cc:"")+'">'+ckLabel(v)+'</span>'+

  h+=disc("notes","Notes",

    '<button id="skip"'+(S.idx>=list.length-1?" disabled":"")+'>Skip ›</button></div><div class="verdicts">'+
    VERDICT.map(function(v){
      var sub=S.prefs.afterVerdict==="next"

        : {Pass:"AND CLOSE",Fail:"LOGS DEFECT",Issue:"LOGS DEFECT"}[v];
      return'<button class="vb" data-v="'+v+'" style="background:'+col(v)+'">'+v+
        '<small>'+sub+'</small></button>'}).join("")+

  return'<div><div style="font-size:12px;color:var(--dim);margin-bottom:6px;text-align:center">'+lab+'</div>'+

function devLine(){
  var box=el("dev");if(!box)return;
  var d=S.draft,f=parseFloat(d.found),b=parseFloat(d.bas),t=parseFloat(d.tol);
  if(isNaN(f)||isNaN(b)){box.textContent="Enter both readings to check tolerance";
    box.style.color="var(--dim)";box.style.borderColor="var(--edge)";return}
  var dev=Math.round((b-f)*100)/100,s=(dev>0?"+":"")+dev;
  if(isNaN(t)){box.innerHTML='<span>Off by '+s+'</span><span style="color:var(--dim)">no tolerance set</span>';
    box.style.color="var(--text)";box.style.borderColor="var(--edge)";return}
  var ok=Math.abs(dev)<=Math.abs(t),c=ok?"var(--pass)":"var(--fail)";
  box.innerHTML='<span>'+(ok?"Within tolerance":"Out of tolerance")+'</span><span class="mono">'+s+' of ±'+t+'</span>';
  box.style.color=c;box.style.borderColor=c;
}

function allIssues(p){
  p=p||proj();if(!p)return[];
  var out=p.points.filter(function(x){return x.issue}).map(function(x){
    return{issue:x.issue,scope:"point",point:x,unit:x.unit,tag:x.tag,
      sub:x.unit+" · "+x.desc,id:"p"+x.id};
  });
  (p.issues||[]).forEach(function(i){
    out.push({issue:i,scope:i.scope||"unit",point:null,unit:i.unit||"",
      tag:i.scope==="job"?"Whole job":(i.unit||"Unit"),
      sub:i.scope==="job"?p.name:(i.unit||""),id:i.id});
  });
  out.sort(function(a,b){return(a.issue.at||0)-(b.issue.at||0)});
  out.forEach(function(x,i){x.def="DEF-"+String(i+1).padStart(3,"0")});
  return out;
}
function unitIssues(p,unit){
  return (p.issues||[]).filter(function(i){
    return i.scope==="unit"&&i.unit===unit&&!i.resolved});
}
function jobIssues(p){
  return (p.issues||[]).filter(function(i){return i.scope==="job"&&!i.resolved});
}
function defects(){
  var p=proj();if(!p)return[];
  var list=allIssues(p);
  var out=list.filter(function(x){
    if(S.defParty!=="any"&&x.issue.party!==S.defParty)return false;
    if(S.defPrio!=="any"&&x.issue.priority!==S.defPrio)return false;
    if(S.defKind!=="any"&&(x.issue.kind||"Defect")!==S.defKind)return false;
    if(S.defScope!=="any"&&x.scope!==S.defScope)return false;
    if(S.defFilter==="open")return!x.issue.resolved;
    if(S.defFilter==="closed")return x.issue.resolved;
    return true;
  });
  var rank={High:0,Medium:1,Low:2};
  out.sort(function(a,b){
    if(!!a.issue.resolved!==!!b.issue.resolved)return a.issue.resolved?1:-1;
    var r=(rank[a.issue.priority]||1)-(rank[b.issue.priority]||1);
    return r||((b.issue.at||0)-(a.issue.at||0));
  });
  return out;
}
function printList(){
  var o=S.printOpts,p=proj();
  var all=allIssues(p);
  var rank={High:0,Medium:1,Low:2};
  return all.filter(function(x){
    var i=x.issue;
    if(o.status==="open"&&i.resolved)return false;
    if(o.status==="closed"&&!i.resolved)return false;
    if(o.prio!=="any"&&i.priority!==o.prio)return false;
    if(o.party!=="any"&&i.party!==o.party)return false;
    if(o.unit!=="any"&&x.unit!==o.unit)return false;
    if(o.kind&&o.kind!=="any"&&(i.kind||"Defect")!==o.kind)return false;
    return true;
  }).sort(function(a,b){
    if(!!a.issue.resolved!==!!b.issue.resolved)return a.issue.resolved?1:-1;
    var r=(rank[a.issue.priority]||1)-(rank[b.issue.priority]||1);
    return r||((a.issue.at||0)-(b.issue.at||0));
  });
}
function filterLine(){
  var o=S.printOpts,bits=[];
  bits.push({open:"Open defects only",closed:"Closed defects only",all:"All defects"}[o.status]);
  if(o.kind&&o.kind!=="any")bits.push(o.kind);
  if(o.prio!=="any")bits.push(o.prio+" priority");
  if(o.party!=="any")bits.push("assigned to "+o.party);
  if(o.unit!=="any")bits.push("unit "+o.unit);
  return bits.join(" · ");
}

/* ═══════ P2P workbook import ═══════

   metadata rows on top, a header row with Unit Tag / Point Name / Type /
   Controller / Description / Address, then one row per point. Sign-off
   columns hold tech initials (done), DNP (did not pass), N/A, or blank. */
function norm(s){return String(s==null?"":s).toLowerCase().replace(/[^a-z0-9]/g,"")}
var COLMAP=[
  ["unittag","unit"],["pointname","tag"],["type","type"],["controller","panel"],
  ["description","desc"],["address","addr"],["addressexui1","addr"],
  ["installedandlabeled","installed"],["pointtopoint","p2p"],
  ["trendhistory","trends"],["alarm","alarm"],["graphic","graphic"],
  ["startupdate","startup"],["notes","notes"]
];
function pickSheet(wb){
  var names=wb.SheetNames;
  var pref=names.filter(function(n){return/p2p|checkout|main/i.test(n)});
  var order=pref.concat(names.filter(function(n){return pref.indexOf(n)<0}));
  for(var i=0;i<order.length;i++){
    var g=XLSX.utils.sheet_to_json(wb.Sheets[order[i]],{header:1,blankrows:true,defval:null});
    for(var r=0;r<Math.min(g.length,30);r++){
      var row=(g[r]||[]).map(norm);
      if(row.indexOf("pointname")>=0&&(row.indexOf("unittag")>=0||row.indexOf("type")>=0))
        return{name:order[i],grid:g,hdr:r};
    }
  }
  return null;
}
function findLabel(grid,upto,re){
  for(var r=0;r<upto;r++){
    var row=grid[r]||[];
    for(var c=0;c<row.length;c++){
      if(row[c]!=null&&re.test(String(row[c]))){
        for(var k=c+1;k<row.length;k++)
          if(row[k]!=null&&String(row[k]).trim()!=="")return String(row[k]).trim();
      }
    }
  }
  return "";
}
function cellState(v){
  var s=String(v==null?"":v).trim();
  if(!s)return{state:null,by:""};
  if(/^n\/?a$/i.test(s))return{state:"na",by:""};
  if(/^dnp$/i.test(s))return{state:"dnp",by:""};
  return{state:"done",by:s};
}
function parseP2P(wb){
  var f=pickSheet(wb);
  if(!f)throw new Error("Couldn't find a header row with Unit Tag and Point Name.");
  var grid=f.grid,hdr=grid[f.hdr]||[],col={};
  hdr.forEach(function(v,i){
    var n=norm(v);if(!n)return;
    for(var k=0;k<COLMAP.length;k++){
      if(n===COLMAP[k][0]||n.indexOf(COLMAP[k][0])===0){
        if(col[COLMAP[k][1]]===undefined)col[COLMAP[k][1]]=i;
        return;
      }
    }
  });
  if(col.tag===undefined)throw new Error("No Point Name column found.");
  var start=f.hdr+1;
  var nx=(grid[start]||[]).map(norm).join("");
  if(/engineering|electrician|specialist/.test(nx))start++;   // responsibility row
  var pts=[],uc={},id=0,verified=0;
  for(var r=start;r<grid.length;r++){
    var row=grid[r]||[];
    var tag=col.tag!==undefined?row[col.tag]:null;
    if(tag==null||String(tag).trim()==="")continue;
    tag=String(tag).trim();
    var type=String((col.type!==undefined?row[col.type]:"")||"").trim().toUpperCase();
    var unit=String((col.unit!==undefined?row[col.unit]:"")||"").trim()||"Unassigned";
    var p2p=cellState(col.p2p!==undefined?row[col.p2p]:null);
    var inst=cellState(col.installed!==undefined?row[col.installed]:null);
    var pt={id:++id,tag:tag,type:type||"-",
      desc:String((col.desc!==undefined?row[col.desc]:"")||"").trim(),
      addr:String((col.addr!==undefined?row[col.addr]:"")||"").trim(),
      unit:unit,sys:String((col.panel!==undefined?row[col.panel]:"")||"").trim(),
      rng:"",status:null,by:null,at:null,reading:null,checks:{},
      notes:String((col.notes!==undefined?row[col.notes]:"")||"").trim(),
      importedBy:"",installedBy:"",p2pNA:false};
    if(p2p.state==="done"){pt.status="Pass";pt.importedBy=p2p.by;pt.at=Date.now();verified++}
    else if(p2p.state==="dnp"){pt.status="Fail";pt.at=Date.now();
      pt.issue={desc:pt.notes||"Marked DNP on the P2P sheet — no description imported.",
        party:"Controls",priority:"Medium",at:Date.now(),by:null,resolved:false}}
    else if(p2p.state==="na")pt.p2pNA=true;
    if(inst.state==="done")pt.installedBy=inst.by;
    else if(inst.state==="na")pt.installedBy="";
    [["trends","Trends"],["alarm","Alarm"],["graphic","Graphic"],["startup","Startup"]]
      .forEach(function(m){
        if(col[m[0]]===undefined)return;
        var st=cellState(row[col[m[0]]]);
        if(st.state==="done")pt.checks[m[1]]="done";
        else if(st.state==="na")pt.checks[m[1]]="na";
      });
    uc[unit]=(uc[unit]||0)+1;
    pts.push(pt);
  }
  return{sheet:f.name,points:pts,verified:verified,
    units:Object.keys(uc).map(function(k){return[k,uc[k]]}),
    jobName:findLabel(grid,f.hdr,/job\s*name/i),
    jobNumber:findLabel(grid,f.hdr,/job\s*(number|#|no)/i)};
}

/* ───────── actions ───────── */
function pull(){
  if(LIVE){
    if(!online()){toast("No signal");return Promise.resolve()}
    return pbLoadProjects().then(function(ps){
      S.projects=ps;
      return kvSet("projects",S.projects);
    }).then(function(){
      pbSubscribe();
      if(!S.toast)toast("Up to date");
    }).catch(function(e){toast(pbErr(e))});
  }
  if(!online()){toast("No signal");return Promise.resolve()}
  var fresh=JSON.parse(JSON.stringify(SERVER_PROJECTS));
  SIM.events.forEach(function(e){applyEvent(e,fresh)});
  S.queue.forEach(function(e){applyEvent(e,fresh)});
  S.projects=fresh;LIVE_SEEN=Date.now();
  return kvSet("projects",S.projects).then(function(){toast("Projects loaded")});
}
function loadDraft(){
  var pt=queue()[S.idx];if(!pt){S.draft=null;return}
  var r=pt.reading||{};
  var defTol=pt.type==="AI"?S.prefs.tolAI:(pt.type==="AO"?S.prefs.tolAO:"");
  var ls=lifeState(pt);
  S.draft={life:ls.value,lifeImplied:ls.implied,found:r.found||"",bas:r.bas||"",
    tol:(r.tol!==undefined&&r.tol!=="")?r.tol:defTol,
    cmd:r.cmd||"",obs:r.obs||"",checks:Object.assign({},pt.checks),notes:pt.notes||""};
  S.open=Object.assign({},S.open,{life:S.prefs.openLife,reading:S.prefs.openReading,
          checks:S.prefs.openChecks,notes:S.prefs.openNotes});
  S.takeover=null;
}
function commit(v){
  var pt=queue()[S.idx];
  if(v==="Fail"||v==="Issue"){
    var ex=pt.issue&&!pt.issue.resolved?pt.issue:null;
    S.modal={kind:"issue",verdict:v,pointId:pt.id,tag:pt.tag,
      desc:(ex&&ex.desc)||S.draft.notes||"",
      party:(ex&&ex.party)||"Controls",
      priority:(ex&&ex.priority)||(v==="Fail"?"High":"Medium"),
      ikind:(ex&&ex.kind)||"Defect",hours:(ex&&ex.hours)||"",
      blocks:!!(ex&&ex.blocks),photos:(ex&&ex.photos)?ex.photos.slice():[]};
    render();return;
  }
  doCommit(v,null);
}
function doCommit(v,issue){
  var pt=queue()[S.idx],d=S.draft;
  var ev={id:uid(),projectId:S.proj,pointId:pt.id,tag:pt.tag,unit:pt.unit,status:v,
    by:S.user.id,at:Date.now(),
    reading:isAnalog(pt.type)?{kind:"analog",found:d.found,bas:d.bas,tol:d.tol}
                             :{kind:"digital",cmd:d.cmd,obs:d.obs},
    checks:Object.assign({},d.checks),notes:issue?issue.desc:d.notes,
    issue:issue};
  applyEvent(ev);S.queue.push(ev);claimUnit();
  qAdd(ev);kvSet("projects",S.projects);
  var msg=online()?(v==="Pass"?"Passed "+pt.tag:v+" logged on "+pt.tag)
                  :"Saved on this phone — "+pt.tag;
  if(S.prefs.afterVerdict==="next"){
    var list=queue();
    if(list.length){
      if(S.idx>=list.length)S.idx=list.length-1;
      loadDraft();toast(msg);flush();return;
    }
  }
  S.screen="points";toast(msg);flush();
}
function massApply(){
  var picked=CHECKS.filter(function(c){return S.massChecks[c]});
  var ids=Object.keys(S.sel).map(Number);
  if(!picked.length||!ids.length)return;
  var p=proj(),cmap={};picked.forEach(function(c){cmap[c]=true});
  var n=0;
  ids.forEach(function(id){
    var pt=p.points.filter(function(x){return x.id===id})[0];if(!pt)return;
    var ev={id:uid(),kind:"checks",projectId:S.proj,pointId:id,tag:pt.tag,unit:pt.unit,
      checks:cmap,mode:S.massMode,by:S.user.id,at:Date.now()};
    applyEvent(ev);S.queue.push(ev);qAdd(ev);n++;
  });
  kvSet("projects",S.projects);
  S.selecting=false;S.sel={};
  toast(({mark:"Marked ",na:"Set N/A: ",clear:"Cleared "}[S.massMode])+picked.join(", ")+" on "+n+" points");
  flush();
}

      m[{npt:"tag",npd:"desc",npa:"addr",npc:"controller",npn:"note"}[id]]=e.value;
    });
  }
  on("npsave","click",function(){
    grabPoint();
    var m=S.modal,p=proj();
    var tag=(m.tag||"").trim();
    if(tag.length<2){toast("Give the point a name");return}
    if(p.points.some(function(x){return x.unit===m.unit&&
        x.tag.toLowerCase()===tag.toLowerCase()})){
      toast(tag+" already exists on "+m.unit);return;
    }
    var nid=p.points.reduce(function(a,x){return Math.max(a,x.id||0)},0)+1;
    var pt={id:nid,tag:tag,type:m.type||"AI",desc:(m.desc||"").trim(),
      addr:(m.addr||"").trim(),unit:m.unit,sys:(m.controller||"").trim(),rng:"",
      status:null,by:null,at:null,reading:null,checks:{},notes:(m.note||"").trim(),
      importedBy:"",installedBy:"",p2pNA:false,
      addedInField:true,addedBy:S.user.id,addedAt:Date.now(),sheetRow:null};
    var ev={id:uid(),kind:"addpoint",projectId:S.proj,point:pt,by:S.user.id,at:Date.now()};
    applyEvent(ev);S.queue.push(ev);qAdd(ev);kvSet("projects",S.projects);
    S.modal=null;S.filter="open";S.limit=60;
    toast(tag+" added to "+m.unit);flush();
  });
  all("[data-uiss]",function(b){b.addEventListener("click",function(){
    S.modal={kind:"issuedetail",issueId:b.dataset.uiss};render()})});
  all("[data-dp]",function(b){b.addEventListener("click",function(){S.defParty=b.dataset.dp;render()})});
  all("[data-dr]",function(b){b.addEventListener("click",function(){S.defPrio=b.dataset.dr;render()})});
  on("defclear","click",function(){S.defParty="any";S.defPrio="any";
    S.defKind="any";S.defScope="any";render()});
  on("ires","click",function(){
    var p=proj(),it=(p.issues||[]).filter(function(q){return q.id===S.modal.issueId})[0];
    if(!it)return;
    var ev={id:uid(),kind:"resolve",projectId:S.proj,issueId:it.id,
      resolved:!it.resolved,by:S.user.id,at:Date.now()};
    applyEvent(ev);S.queue.push(ev);qAdd(ev);kvSet("projects",S.projects);
    S.modal=null;toast(ev.resolved?"Marked resolved":"Reopened");flush();
  });
  all("[data-def]",function(b){b.addEventListener("click",function(){
    var key=b.dataset.def,p=proj();
    var rec=allIssues(p).filter(function(x){return x.id===key})[0];
    if(!rec)return;
    if(rec.scope!=="point"){S.modal={kind:"issuedetail",issueId:rec.issue.id};render();return}
    var id=rec.point.id;
    var pt=rec.point;
    S.unit=pt.unit;S.filter="all";S.limit=60;S._prev="issues";
    var list=queue();
    for(var i=0;i<list.length;i++)if(list[i].id===id){S.idx=i;break}
    loadDraft();S.screen="verify";render();
  })});

  on("newproj","click",function(){S.modal={kind:"newproj",preview:null,jobName:"",jobNumber:"",loc:""};render()});
  on("pfile","change",function(e){
    var file=e.target.files&&e.target.files[0];if(!file)return;
    if(typeof XLSX==="undefined"){S.modal.err="Spreadsheet reader didn't load. Reconnect and try again.";render();return}
    S.modal.busy=true;S.modal.err=null;render();
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var wb=XLSX.read(new Uint8Array(fr.result),{type:"array"});
        var pv=parseP2P(wb);
        if(!pv.points.length)throw new Error("No point rows found under the header.");
        S.modal.preview=pv;
        S.modal.jobName=pv.jobName||file.name.replace(/\.[^.]+$/,"");
        S.modal.jobNumber=pv.jobNumber||"";
        S.modal.busy=false;render();
      }catch(err){S.modal.busy=false;S.modal.err=String(err.message||err);render()}
    };
    fr.onerror=function(){S.modal.busy=false;S.modal.err="Could not read that file.";render()};
    fr.readAsArrayBuffer(file);
  });
  ["njn","njno","njloc"].forEach(function(id){on(id,"input",function(e){
    S.modal[{njn:"jobName",njno:"jobNumber",njloc:"loc"}[id]]=e.target.value})});
  on("ncreate","click",function(){
    var m=S.modal,pv=m.preview;
    var nm=(el("njn")?el("njn").value:m.jobName).trim()||"Untitled job";
    var no=(el("njno")?el("njno").value:m.jobNumber).trim();
    var lc=(el("njloc")?el("njloc").value:m.loc||"").trim();
    var p={id:"imp"+Date.now().toString(36),job:no||"—",name:nm,
      loc:lc||("Imported from "+pv.sheet),points:pv.points};
    S.projects=S.projects.concat([p]);
    SERVER_PROJECTS=SERVER_PROJECTS.concat([JSON.parse(JSON.stringify(p))]);
    S.modal=null;
    kvSet("projects",S.projects).then(function(){
      toast(pv.points.length+" points imported");
      S.proj=p.id;S.unit=null;S.q="";S.filter="open";S.screen="units";render();
    });
  });
  function grabForm(){
    var d=el("mdesc");if(d)S.modal.desc=d.value;
    var hh=el("ihrs");if(hh)S.modal.hours=hh.value;
  }
  all("[data-ik]",function(b){b.addEventListener("click",function(){
    grabForm();S.modal.ikind=b.dataset.ik;
    if(b.dataset.ik==="Rework"&&S.modal.party==="Controls")S.modal.party="Engineering";
    render()})});
  all("[data-is]",function(b){b.addEventListener("click",function(){
    grabForm();S.modal.scope=b.dataset.is;render()})});
  all("[data-iu]",function(b){b.addEventListener("click",function(){
    grabForm();S.modal.unit=b.dataset.iu;render()})});
  on("iblock","click",function(){grabForm();S.modal.blocks=!S.modal.blocks;render()});
  on("ihrs","input",function(e){S.modal.hours=e.target.value});
  all("[data-rmph]",function(b){b.addEventListener("click",function(){
    grabForm();S.modal.photos.splice(+b.dataset.rmph,1);render()})});
  on("iphoto","change",function(e){
    var f=e.target.files&&e.target.files[0];if(!f)return;
    grabForm();
    shrinkPhoto(f,function(data){
      if(!data){toast("Could not read that photo");return}
      S.modal.photos=(S.modal.photos||[]).concat([data]);render();
    });
  });
  on("isave","click",function(){
    grabForm();var m=S.modal;
    if(!m.desc||!m.desc.trim()){toast("Say what is wrong first");return}
    if((m.scope||"unit")==="unit"&&!m.unit){toast("Pick which unit");return}
    var iss={id:newIssueId(),scope:m.scope||"unit",unit:m.unit||"",
      desc:m.desc.trim(),kind:m.ikind||"Defect",party:m.party,priority:m.priority,
      hours:m.hours||"",blocks:!!m.blocks,photos:(m.photos||[]).slice(),
      at:Date.now(),by:S.user.id,resolved:false};
    var ev={id:uid(),kind:"issue",projectId:S.proj,issue:iss,by:S.user.id,at:Date.now()};
    applyEvent(ev);S.queue.push(ev);qAdd(ev);kvSet("projects",S.projects);
    S.modal=null;toast("Issue logged");flush();
  });
  on("mcancel","click",function(){S.modal=null;render()});
  on("ovl","click",function(e){if(e.target&&e.target.id==="ovl"){S.modal=null;render()}});
  on("mdesc","input",function(e){S.modal.desc=e.target.value});
  all("[data-mp]",function(b){b.addEventListener("click",function(){
    S.modal.party=b.dataset.mp;var d=el("mdesc");if(d)S.modal.desc=d.value;render()})});
  all("[data-mr]",function(b){b.addEventListener("click",function(){
    S.modal.priority=b.dataset.mr;var d=el("mdesc");if(d)S.modal.desc=d.value;render()})});
  on("msave","click",function(){
    var d=el("mdesc");if(d)S.modal.desc=d.value;
    var m=S.modal;
    if(!m.desc.trim()){toast("Say what is wrong first");if(d)d.focus();return}
    S.draft.notes=m.desc;
    var v=m.verdict;
    S.modal=null;
    doCommit(v,{desc:m.desc.trim(),party:m.party,priority:m.priority,
      kind:m.ikind||"Defect",hours:m.hours||"",blocks:!!m.blocks,
      photos:(m.photos||[]).slice(),scope:"point"});
  });

  on("sel","click",function(){S.selecting=true;S.sel={};render()});
  on("selcancel","click",function(){S.selecting=false;S.sel={};render()});
  on("selall","click",function(){
    var shown=queue(),allOn=shown.every(function(x){return S.sel[x.id]});
    if(allOn)S.sel={};else shown.forEach(function(x){S.sel[x.id]=true});
    render();
  });
  all("[data-mm]",function(b){b.addEventListener("click",function(){S.massMode=b.dataset.mm;render()})});
  all("[data-mc]",function(b){b.addEventListener("click",function(){
    S.massChecks[b.dataset.mc]=!S.massChecks[b.dataset.mc];render()})});
  on("apply","click",massApply);
  on("assign","click",function(){
    var ids=Object.keys(S.sel).map(Number);if(!ids.length)return;
    var p=proj(),pts=p.points.filter(function(x){return ids.indexOf(x.id)>=0});
    var us={};pts.forEach(function(x){us[x.unit]=1});
    var unames=Object.keys(us);
    var name=unames.length===1?unames[0]+" — "+ids.length+" points"
      :ids.length+" points across "+unames.length+" units";
    S.modal={kind:"assign",ids:ids,who:null,name:name,due:"1",note:""};render();
  });
  all("[data-asu]",function(b){b.addEventListener("click",function(){
    var nm=el("asname");if(nm)S.modal.name=nm.value;
    var nt=el("asnote");if(nt)S.modal.note=nt.value;
    S.modal.who=b.dataset.asu;render()})});
  all("[data-asd]",function(b){b.addEventListener("click",function(){
    var nm=el("asname");if(nm)S.modal.name=nm.value;
    var nt=el("asnote");if(nt)S.modal.note=nt.value;
    S.modal.due=b.dataset.asd;render()})});
  on("asgo","click",function(){
    var m=S.modal,p=proj();
    var name=(el("asname")?el("asname").value:m.name).trim()||m.name;
    var note=(el("asnote")?el("asnote").value:"").trim();
    var due=m.due===""?null:Date.now()+parseInt(m.due,10)*86400000;
    var pk={id:"pk"+Date.now().toString(36),name:name,assignee:m.who,
      by:S.user.id,at:Date.now(),due:due,note:note,pointIds:m.ids};
    var ev={id:uid(),kind:"package",projectId:S.proj,pkg:pk,by:S.user.id,at:Date.now()};
    applyEvent(ev);S.queue.push(ev);qAdd(ev);kvSet("projects",S.projects);
    S.modal=null;S.selecting=false;S.sel={};
    toast("Sent to "+TECHS[m.who].n.split(" ")[0]);flush();
  });

  /* ---- packages ---- */
  on("towork","click",function(){S.screen="work";render()});
  all("[data-pf]",function(b){b.addEventListener("click",function(){S.pkgFilter=b.dataset.pf;render()})});
  all("[data-pkg]",function(b){b.addEventListener("click",function(){
    var parts=b.dataset.pkg.split("|");
    S.proj=parts[0];S.pkg=parts[1];S.unit=null;S.filter="open";S.limit=60;
    S.selecting=false;S.sel={};S._prev="work";S.screen="points";render();
  })});
  on("leavepkg","click",function(){S.pkg=null;S.screen="units";render()});

  all("[data-disc]",function(b){b.addEventListener("click",function(){
    var k=b.dataset.disc;S.open[k]=!S.open[k];render();
    if(k==="notes"&&S.open[k]&&el("nt"))el("nt").focus();
  })});
  all("[data-pref]",function(b){b.addEventListener("click",function(){
    var k=b.dataset.pref;
    if(k==="afterVerdict")S.prefs.afterVerdict=S.prefs.afterVerdict==="next"?"list":"next";
    else S.prefs[k]=!S.prefs[k];
    kvSet("prefs",S.prefs);render();
  })});
  ["tolAI","tolAO"].forEach(function(id){on(id,"input",function(e){
    S.prefs[id]=e.target.value;kvSet("prefs",S.prefs)})});

  all("[data-life]",function(b){b.addEventListener("click",function(){
    var pt=queue()[S.idx];if(!pt||hasVerdict(pt))return;
    var v=S.draft.life===b.dataset.life?null:b.dataset.life;
    S.draft.life=v;
    var ev={id:uid(),kind:"life",projectId:S.proj,pointId:pt.id,tag:pt.tag,unit:pt.unit,
      status:v,by:S.user.id,at:Date.now()};
    applyEvent(ev);S.queue.push(ev);qAdd(ev);kvSet("projects",S.projects);
    render();flush();
  })});
  all("[data-cmd]",function(b){b.addEventListener("click",function(){S.draft.cmd=b.dataset.cmd;render()})});
  all("[data-obs]",function(b){b.addEventListener("click",function(){S.draft.obs=b.dataset.obs;render()})});
  all("[data-ck]",function(b){b.addEventListener("click",function(){
    var c=b.dataset.ck,nv=ckNext(ckState(S.draft.checks,c));
    if(nv)S.draft.checks[c]=nv;else delete S.draft.checks[c];
    render()})});
  ["rF","rB","rT"].forEach(function(id){on(id,"input",function(e){
    S.draft[{rF:"found",rB:"bas",rT:"tol"}[id]]=e.target.value;devLine()})});
  if(el("dev"))devLine();
  on("nt","input",function(e){S.draft.notes=e.target.value});
  on("vaddr","change",function(e){
    var pt=queue()[S.idx];if(!pt)return;
    var v=e.target.value.trim();
    if(v===pt.addr)return;
    var ev={id:uid(),kind:"edit",projectId:S.proj,pointId:pt.id,tag:pt.tag,unit:pt.unit,
      field:"addr",value:v,by:S.user.id,at:Date.now()};
    applyEvent(ev);S.queue.push(ev);qAdd(ev);kvSet("projects",S.projects);
    toast("Address saved as "+(v||"blank"));flush();
  });
  on("sortbtn","click",function(){S.modal={kind:"sort"};render()});
  all("[data-so]",function(b){b.addEventListener("click",function(){
    S.sort=b.dataset.so;S.limit=60;S.modal=null;render()})});
  on("prev","click",function(){if(S.idx>0){S.idx--;loadDraft();render()}});
  on("skip","click",function(){if(S.idx<queue().length-1){S.idx++;loadDraft();render()}});
  all("[data-v]",function(b){b.addEventListener("click",function(){commit(b.dataset.v)})});
}

/* ───────── boot ───────── */
function freshCopy(){return JSON.parse(JSON.stringify(SERVER_PROJECTS))}

function bootLive(){
  return kvGet("pbAuth").then(function(c){
    if(c){try{pb.authStore.loadFromCookie(c)}catch(e){}}
    if(!pb.authStore.isValid)return false;
    return pb.collection("users").authRefresh().then(function(a){
      return pbLoadTechs().then(function(t){
        TECHS=t;
        S.user={id:a.record.id,n:a.record.name||a.record.email,
          i:(a.record.initials||"").toUpperCase()};
        S.screen="projects";
        return true;
      });
    }).catch(function(){return false});
  });
}
if(LIVE){
  Promise.all([bootLive(),kvGet("projects"),qAll(),kvGet("prefs")]).then(function(r){
    var signedIn=r[0];
    // Cached points let the app open with no signal; the server refresh
    // follows and overwrites them.
    if(r[1]&&r[1].length)S.projects=r[1];
    S.queue=r[2]||[];
    if(r[3])S.prefs=Object.assign(S.prefs,r[3]);
    render();
    if(signedIn&&online())return pull().then(function(){flush()});
  }).catch(function(e){S.authErr=pbErr(e);render()});
}else
kvGet("dataVersion").then(function(v){
  if(v===DATA_VERSION)return false;
  /* the bundled job changed — clear whatever this device was holding */
  return wipe().then(function(){
    return kvSet("dataVersion",DATA_VERSION);
  }).then(function(){return true});
}).catch(function(){return true}).then(function(reset){
  return Promise.all([kvGet("projects"),kvGet("user"),qAll(),kvGet("prefs")])
    .then(function(r){return{reset:reset,r:r}});
}).then(function(o){
  var r=o.r;
  S.projects=(!o.reset&&r[0]&&r[0].length)?r[0]:freshCopy();
  if(!o.reset&&r[1]){S.user=r[1];S.pick=r[1].id;S.screen="projects"}
  S.queue=o.reset?[]:(r[2]||[]);
  if(!o.reset&&r[3])S.prefs=Object.assign(S.prefs,r[3]);
  LIVE_SEEN=Date.now();
  return kvSet("projects",S.projects);
}).then(function(){render();flush()})
  .catch(function(){S.projects=freshCopy();render()});

setInterval(function(){flush()},FLUSH_EVERY);
setInterval(function(){coworkerTick();liveTick()},COWORKER_EVERY);

/* ---- installed-app plumbing (no effect inside a preview frame) ---- */
if("serviceWorker" in navigator&&location.protocol==="https:"){
  navigator.serviceWorker.register("/sw.js").catch(function(){});
}
if(navigator.storage&&navigator.storage.persist){
  navigator.storage.persisted().then(function(p){
    return p||navigator.storage.persist();
  }).catch(function(){});
}
</script>
