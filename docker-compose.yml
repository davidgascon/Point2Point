# Field Checkout — deployment stack
#
#   caddy       TLS termination, static app, reverse proxy      :80 :443
#   pocketbase  auth, database, realtime, admin UI              internal :8090
#   exporter    writes app data back into the .xlsm template    internal :8000
#
# Only Caddy publishes ports. PocketBase and the exporter are reachable
# only through it, so nothing on the VM is exposed without TLS.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"      # LAN / health checks, no TLS
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
      TLS_EMAIL: ${TLS_EMAIL:?set TLS_EMAIL in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - pocketbase
      - exporter

  pocketbase:
    build:
      context: ./pocketbase
      args:
        PB_VERSION: ${PB_VERSION:-0.29.3}
    restart: unless-stopped
    environment:
      # Used by PocketBase for the links in password-reset emails.
      PB_PUBLIC_URL: https://${APP_DOMAIN}
    volumes:
      - pb_data:/pb/pb_data
      - ./pocketbase/pb_migrations:/pb/pb_migrations
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  exporter:
    build: ./exporter
    restart: unless-stopped
    environment:
      # The exporter verifies every caller's token against PocketBase
      # before it will touch a template.
      PB_INTERNAL_URL: http://pocketbase:8090
    volumes:
      - templates:/templates
    depends_on:
      pocketbase:
        condition: service_healthy

volumes:
  pb_data:       # SQLite database, uploaded photos, auth records
  templates:     # one original .xlsm per project, used as the export template
  caddy_data:    # TLS certificates — do not delete, rate limits apply
  caddy_config:
