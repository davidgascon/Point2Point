# Field Checkout — behind your existing Nginx Proxy Manager.
#
#   web         nginx: serves the app, routes /api and /export   host :${APP_PORT}
#   pocketbase  auth, database, realtime, admin dashboard        internal
#   exporter    writes data back into the .xlsm template         internal
#
# Only `web` publishes a port. Point one NPM proxy host at it and you are done.

services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/srv:ro
    depends_on:
      pocketbase:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  pocketbase:
    build:
      context: ./pocketbase
      args:
        PB_VERSION: ${PB_VERSION:-0.29.3}
    restart: unless-stopped
    environment:
      # Used for the links inside password-reset emails.
      PB_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    volumes:
      - pb_data:/pb/pb_data
      - ./pocketbase/pb_migrations:/pb/pb_migrations
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  exporter:
    build: ./exporter
    restart: unless-stopped
    environment:
      PB_INTERNAL_URL: http://pocketbase:8090
    volumes:
      - templates:/templates
    depends_on:
      pocketbase:
        condition: service_healthy

volumes:
  pb_data:     # database, photos, accounts
  templates:   # one source workbook per project

# If your Nginx Proxy Manager runs in its own compose stack and you would
# rather route container-to-container than via a host port, uncomment this,
# put `web` on the same network, and point NPM at http://field-checkout-web:8080.
#
# networks:
#   default:
#     name: npm_default
#     external: true
