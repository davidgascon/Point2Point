# Field Checkout — behind your existing Nginx Proxy Manager.
#
#   web         nginx: serves the app, routes /api and /export   host :${APP_PORT}
#   pocketbase  auth, database, realtime, admin dashboard        internal
#   exporter    writes data back into the .xlsm template         internal
#
# Everything is built into images — no bind mounts. Only named volumes hold
# state, so a stack manager cannot break this by inventing empty folders.
#
# Deploy in Portainer as: Stacks -> Add stack -> Repository.

services:
  web:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      pocketbase:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  pocketbase:
    build:
      context: ./pocketbase
      args:
        PB_VERSION: ${PB_VERSION:-0.29.3}
    restart: unless-stopped
    environment:
      # Used in the links inside password-reset emails.
      PB_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    volumes:
      - pb_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  exporter:
    build: ./exporter
    restart: unless-stopped
    environment:
      PB_INTERNAL_URL: http://pocketbase:8090
    volumes:
      - templates:/templates
    depends_on:
      pocketbase:
        condition: service_healthy

volumes:
  pb_data:
    driver: local      # database, photos, accounts
  templates:
    driver: local      # one source workbook per project
