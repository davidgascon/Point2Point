# Internal router. TLS and the public hostname are handled by Nginx Proxy
# Manager in front of this; here we only fan requests out to the right
# container, so NPM needs a single proxy host entry.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 32m;          # photo uploads and .xlsm templates
    absolute_redirect off;

    # Docker's embedded DNS. Combined with the variables below, upstream names
    # are resolved at request time rather than when nginx starts. Without this
    # nginx refuses to start if a backend is not up yet, and holds a stale IP
    # if one restarts.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # ---- realtime is server-sent events; must come before /api/ ----
    location /api/realtime {
        set $pb_rt http://pocketbase:8090;
        proxy_pass $pb_rt$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection        "";
        proxy_buffering off;              # buffering would stall the stream
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    # ---- backend: auth, data, uploaded files ----
    location /api/ {
        set $pb_api http://pocketbase:8090;
        proxy_pass $pb_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 600s;
    }

    # ---- PocketBase dashboard ----
    location /_/ {
        set $pb_ui http://pocketbase:8090;
        proxy_pass $pb_ui$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ---- .xlsm export service ----
    location /export/ {
        set $ex http://exporter:8000;
        proxy_pass $ex$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;           # large workbooks take a moment
    }

    # ---- the app ----
    root /srv;
    index index.html;

    # Never cache the service worker, or phones keep running an old build.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(png|woff2|webmanifest)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }
}
